<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Tracker Review</title>
<style>
  :root { --bg:#fbfaf7; --fg:#1d1d1b; --muted:#6b6b66; --line:#e2dfd6; --ok:#2f6f3e; --bad:#a3392b; --warn:#8a5a00; --card:#fff; --accent:#2c4f7c; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161614; --fg:#ecebe6; --muted:#a19f97; --line:#34332f; --ok:#7fc28f; --bad:#e58b7d; --warn:#e0b45c; --card:#1f1f1c; --accent:#8fb1de; } }
  * { box-sizing: border-box; }
  body { margin:0; font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:12px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--bg); z-index:2; display:flex; gap:18px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; }
  .tabs button { font:inherit; padding:6px 14px; border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:6px; cursor:pointer; }
  .tabs button.on { border-color:var(--accent); color:var(--accent); font-weight:600; }
  .muted { color:var(--muted); }
  main { display:grid; grid-template-columns: 270px 1fr; }
  nav { border-right:1px solid var(--line); overflow:auto; max-height: calc(100vh - 58px); position:sticky; top:58px; }
  nav .filter { padding:10px 14px; border-bottom:1px solid var(--line); font-size:14px; }
  nav button.row { display:block; width:100%; text-align:left; padding:9px 14px; border:0; border-bottom:1px solid var(--line); background:none; color:inherit; cursor:pointer; font:inherit; }
  nav button.row.active { background:var(--card); font-weight:600; }
  .tag { display:inline-block; font-size:12px; padding:0 7px; border-radius:10px; border:1px solid var(--line); margin-right:4px; }
  .tag.rand { border-color:var(--accent); color:var(--accent); } .tag.flag { border-color:var(--bad); color:var(--bad); } .tag.done { border-color:var(--ok); color:var(--ok); }
  section { padding:18px 20px 60px; max-width: 980px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:14px 16px; margin-bottom:12px; }
  .card h3 { margin:0 0 2px; font-size:15px; }
  .q { color:var(--muted); font-size:14px; margin-bottom:8px; }
  .value { font-weight:600; margin:6px 0; white-space:pre-wrap; }
  blockquote { margin:6px 0; padding:6px 10px; border-left:3px solid var(--line); font-size:14px; }
  blockquote .loc { font-size:12px; color:var(--muted); display:block; }
  .btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; align-items:center; }
  .btns button { font:inherit; font-size:14px; padding:5px 12px; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
  .btns button.sel-correct { background:var(--ok); color:#fff; border-color:var(--ok); }
  .btns button.sel-corrected { background:var(--bad); color:#fff; border-color:var(--bad); }
  .btns button.sel-unsure { background:var(--warn); color:#fff; border-color:var(--warn); }
  input[type=text], textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:5px; background:var(--bg); color:var(--fg); font:inherit; }
  textarea { min-height:60px; }
  .big { display:inline-block; padding:8px 14px; border-radius:6px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; }
  .primary { font:inherit; padding:9px 16px; border-radius:6px; border:1px solid var(--accent); background:var(--accent); color:#fff; cursor:pointer; font-weight:600; }
  .secondary { font:inherit; padding:9px 16px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--fg); cursor:pointer; }
  .flags { border-color:var(--bad); } .flags li { color:var(--bad); }
  table.hdr { border-collapse:collapse; width:100%; font-size:14px; } table.hdr td { padding:3px 6px; vertical-align:top; } table.hdr td:first-child { color:var(--muted); width:150px; }
  .qform .card label { display:block; margin:4px 0; }
  a { color:var(--accent); }
  .hidden { display:none; }
  @media (max-width: 760px) { main { grid-template-columns: 1fr; } nav { position:static; max-height:none; } }
</style>
</head>
<body>
<header>
  <h1>Tracker review</h1>
  <div class="tabs"><button id="t-review" class="on">Spot-check</button> <button id="t-rules">Rules</button> <button id="t-questions">Questions</button> <button id="t-fakes">Fake citations</button></div>
  <span id="progress" class="muted"></span>
</header>
<div id="v-review"><main><nav id="list"></nav><section id="detail"><p class="muted">Loading…</p></section></main></div>
<div id="v-rules" class="hidden"><section id="rulesview"></section></div>
<div id="v-questions" class="hidden"><section class="qform" id="qform"></section></div>
<div id="v-fakes" class="hidden"><section id="fakesview"></section></div>
<script>
const HEADER = ["mnc","title_as_published","court","date","family_law_matter"];
const JUDGE = ["party_type","ai_use","ai_tool_if_stated","error_types","impugned_citations","consequence","regulator_referred","practice_note_cited"];
const HELP = {
  mnc: "Citation", title_as_published: "Case title", court: "Court or tribunal", date: "Decision date", family_law_matter: "Family law matter?",
  party_type: ["Who put the AI material before the court?", "Does the judgment say this person prepared or relied on it?", "lawyer · self_represented · expert · judicial_officer · other"],
  ai_use: ["AI use admitted, found, suspected or denied?", "Is that how the court itself puts it? (Suspected must not become admitted.)", "admitted · found_by_court · suspected · denied"],
  ai_tool_if_stated: ["AI tool named", "Only if the judgment names one. Blank is right if none is named.", ""],
  error_types: ["What went wrong", "Do these match what the court found? Anything missing?", "non_existent_case · non_existent_legislation · misdescribed_authority · false_quote · wrong_pinpoint · fabricated_fact_or_evidence · other"],
  impugned_citations: ["The bad citations", "Each copied as the court gives it, with the court's description? Any the court lists missing? 'asserted by party' = only a party said so.", "non_existent · not_located · exists_but_misdescribed · false_quote · wrong_pinpoint · not_stated"],
  consequence: ["What the court did about it", "Right? Anything missing (costs, referral, warning, dismissal)?", "personal_costs_order · adverse_costs_order · regulator_referral · submissions_disregarded · warning_or_admonishment · application_or_appeal_dismissed · leave_refused · no_consequence_stated · other"],
  regulator_referred: ["Referred to a regulator?", "'yes' only if the court referred the person, or directed a referral, to a regulator.", "yes · no_stated · (blank)"],
  practice_note_cited: ["AI practice note cited", "Is this the practice note or direction the court mentions? Blank is right if none.", ""],
};
let rows = [], current = null, onlyRandom = true;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const val = f => Array.isArray(f) ? f.map(i => `${i.citation_verbatim}   [${i.characterisation}; asserted by ${i.asserted_by}]`).join("\n")
  : (!f ? "" : Array.isArray(f.values) ? f.values.join("; ") : (f.value ?? ""));
const qids = f => Array.isArray(f) ? f.flatMap(i => i.quote_ids) : (f?.quote_ids || []);

const TABS = ["review", "rules", "questions", "fakes"];
for (const t of TABS) document.getElementById("t-" + t).onclick = () => tab(t);
function tab(t){
  if (t === "fakes") renderFakes();
  for (const x of TABS) {
    document.getElementById("v-" + x).classList.toggle("hidden", t !== x);
    document.getElementById("t-" + x).classList.toggle("on", t === x);
  }
}

async function load(){
  rows = await (await fetch("/api/queue")).json();
  renderList();
  const first = visible().find(r => !r.decision) || visible()[0];
  if (first) show(first.row);
  renderQuestions();
  renderRules();
}

// ---- Rules -----------------------------------------------------------------
const RULE_NAMES = { who_is_bound: "Who is bound", disclosure_duty: "Disclosure duty", banned_or_cautioned_uses: "Banned or cautioned uses",
  verification_duty: "Verification duty", consequences: "Consequences" };
async function renderRules(){
  const list = await (await fetch("/api/rules")).json();
  const todo = list.filter(i => !i.same_as), done = todo.filter(i => i.decision).length;
  const left = todo.filter(i => !i.decision).map(i => i.court);
  list.sort((a, b) => !!a.decision - !!b.decision || !!a.same_as - !!b.same_as);  // still to check first
  document.getElementById("rulesview").innerHTML = `<h2 style="margin-top:0">Check the rules matrix</h2>
    <p class="muted">${done} of ${todo.length} instruments checked.${left.length ? ` <strong>Still to check (at the top): ${esc(left.join("; "))}.</strong>` : " All done."} Each box is my plain-English summary. Under it are the exact words from the court's text that it rests on (already confirmed to be in that paragraph). Ask one thing: <em>is the summary fair to those words, with nothing overstated?</em> For example, "should" must not become "must". Open the official text if you want the full context. About 1 hour in total.</p>` +
    list.map(i => i.same_as ? `<div class="card"><h3>${esc(i.instrument)}</h3><div class="muted">Word-for-word the same as Queensland Supreme Court PD 5 of 2025 (checked by script), so checking that one covers this.</div></div>` :
    `<div class="card rule" data-key="${esc(i.key)}"><h3>${esc(i.instrument)}</h3>
      <p style="margin:6px 0 10px"><a class="big" href="${esc(i.url)}" target="_blank" rel="noopener">Open the official text ↗</a> <span class="muted">issued ${esc(i.issued)}</span> ${i.decision ? '<span class="tag done">checked</span>' : ''}</p>
      ${i.cells.map(c => { const dv = i.decision?.cells?.[c.column] || {};
        return `<div class="card field" data-col="${c.column}" data-verdict="${esc(dv.verdict || "")}" style="margin-bottom:8px">
        <h3>${esc(RULE_NAMES[c.column])}</h3><div class="value" style="font-weight:500">${esc(c.text)}</div>
        ${c.evidence.map(e => `<blockquote>${esc(e.quote)}<span class="loc">paragraph ${esc(e.paragraph)}</span></blockquote>`).join("")}
        <div class="btns"><button data-v="correct">✓ Fair</button><button data-v="corrected">✗ Needs changing</button><button data-v="unsure">? Unsure</button></div>
        <div class="extra hidden" style="margin-top:8px"><input type="text" value="${esc(dv.value ?? "")}"></div></div>`; }).join("")}
      <div class="btns"><button class="primary rall">All fair, save</button> <button class="secondary rsave">Save</button> <span class="muted rsaved"></span></div>
    </div>`).join("");
  document.querySelectorAll(".rule .field").forEach(el => {
    const mark = v => { el.dataset.verdict = v; el.querySelectorAll(".btns button").forEach(b => b.className = b.dataset.v === v ? "sel-" + v : "");
      const ex = el.querySelector(".extra"); ex.classList.toggle("hidden", v === "correct" || !v);
      ex.querySelector("input").placeholder = v === "unsure" ? "Why unsure?" : "What it should say"; };
    el.querySelectorAll(".btns button").forEach(b => b.onclick = () => mark(b.dataset.v));
    if (el.dataset.verdict) mark(el.dataset.verdict);
  });
  document.querySelectorAll(".rule").forEach(card => {
    const save = async allOk => {
      const cells = {}, missing = [];
      card.querySelectorAll(".field").forEach(el => { let v = el.dataset.verdict; if (!v && allOk) v = "correct";
        if (!v) { missing.push(RULE_NAMES[el.dataset.col]); return; }
        cells[el.dataset.col] = { verdict: v, value: v === "correct" ? null : (el.querySelector(".extra input").value.trim() || null) }; });
      if (missing.length) { card.querySelector(".rsaved").textContent = "Not saved. Still to mark: " + missing.join("; "); return; }
      const res = await fetch("/api/rules_decision", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({ key: card.dataset.key, cells }) });
      if (res.ok) renderRules(); else card.querySelector(".rsaved").textContent = "Save failed.";
    };
    card.querySelector(".rall").onclick = () => save(true);
    card.querySelector(".rsave").onclick = () => save(false);
  });
}
const visible = () => rows.filter(r => !onlyRandom || r.random_spot_check);
function renderList(){
  const v = visible(), done = v.filter(r => r.decision).length;
  document.getElementById("progress").textContent = `${done} of ${v.length} ${onlyRandom ? "random rows" : "rows"} saved`;
  document.getElementById("list").innerHTML = `
    <div class="filter"><label><input type="checkbox" id="onlyrand" ${onlyRandom ? "checked" : ""}> Only the 10 random rows (option A)</label></div>` +
    v.map(r => `<button class="row ${current===r.row?"active":""}" data-row="${r.row}">
      <div>${esc(r.id)} · ${esc(r.mnc || "(no citation)")}</div>
      <div>${r.random_spot_check ? '<span class="tag rand">random</span>' : ''}${r.status==="flagged_for_review" ? '<span class="tag flag">flagged</span>' : ''}${r.status==="not_auto_verifiable" ? '<span class="tag flag">by hand</span>' : ''}${r.decision ? '<span class="tag done">done</span>' : ''}</div>
    </button>`).join("");
  document.getElementById("onlyrand").onchange = e => { onlyRandom = e.target.checked; renderList(); };
  document.querySelectorAll("nav button.row").forEach(b => b.onclick = () => show(b.dataset.row));
}

function quotesHtml(r, ids){
  return ids.map(id => { const q = r.quotes[id];
    return q ? `<blockquote>${esc(q.text)}<span class="loc">page ${esc(q.page)}${q.paragraph ? " · paragraph [" + esc(q.paragraph) + "]" : " · orders / front matter"}</span></blockquote>` : "";
  }).join("") || '<div class="muted">No supporting passage (the value is blank).</div>';
}
function paragraphsToRead(r){
  const ps = new Set(); let front = false;
  for (const k of JUDGE) for (const id of qids(r.fields[k])) { const q = r.quotes[id]; if (!q) continue; if (q.paragraph) ps.add(+q.paragraph); else front = true; }
  const list = [...ps].sort((a, b) => a - b).map(p => `[${p}]`);
  if (front) list.unshift("the orders at the top");
  return list.join(", ");
}

function show(row){
  current = row; renderList();
  const r = rows.find(x => x.row === row), d = r.decision?.fields || {};
  const link = Object.values(r.links)[0];
  const bad = r.checks.filter(c => !c.passed);
  const headerOk = HEADER.every(k => !d[k] || d[k].verdict === "correct");
  const hdrRows = HEADER.filter(k => k in r.fields).map(k => `<tr><td>${esc(HELP[k])}</td><td>${esc(val(r.fields[k])) || '<span class="muted">(blank)</span>'}</td>
     <td class="hfix ${headerOk ? "hidden" : ""}"><input type="text" data-hfield="${k}" placeholder="correct value (leave empty if right)" value="${esc(d[k]?.verdict === "corrected" ? d[k].value : "")}"></td></tr>`).join("");
  const judge = JUDGE.filter(k => k in r.fields).map(k => { const [name, q, allowed] = HELP[k], dv = d[k] || {};
    return `<div class="card field" data-field="${k}" data-verdict="${esc(dv.verdict || "")}">
      <h3>${esc(name)}</h3><div class="q">${esc(q)}</div>
      <div class="value">${esc(val(r.fields[k])) || '<span class="muted">(blank)</span>'}</div>
      ${quotesHtml(r, qids(r.fields[k]))}
      <div class="btns">
        <button data-v="correct">✓ Correct</button><button data-v="corrected">✗ Wrong</button><button data-v="unsure">? Unsure</button>
      </div>
      <div class="extra hidden" style="margin-top:8px">
        <input type="text" value="${esc(dv.value ?? "")}">
        ${allowed ? `<div class="muted" style="font-size:12px;margin-top:3px">Allowed values: ${esc(allowed)} (separate several with ";")</div>` : ""}
      </div>
    </div>`; }).join("");
  document.getElementById("detail").innerHTML = `
    <div class="card">
      <div style="font-size:17px"><strong>${esc(r.id)}</strong> · ${esc(r.mnc)} · ${esc(r.date)}</div>
      <div class="muted">${esc(r.court)}${r.random_spot_check ? " · random spot-check" : ""}</div>
      <p style="margin:10px 0">${link ? `<a class="big" href="${esc(link)}" target="_blank" rel="noopener">Open the judgment ↗</a>` : '<span class="muted">No link: find the judgment by its citation.</span>'}
      ${r.source_kind !== "charlotin_document" ? ` <a href="${esc(r.source_url)}" target="_blank" rel="noopener">source listed by Charlotin</a>` : ""}</p>
      <div><strong>Read:</strong> paragraphs ${esc(paragraphsToRead(r)) || "about AI use"}, and skim the paragraphs around them.</div>
      <details style="margin-top:8px"><summary class="muted">How this works (30 seconds)</summary>
        <p>For each box below, ask one thing: <em>does the judgment really say this, in the court's own words?</em> Click <strong>✓ Correct</strong>, or <strong>✗ Wrong</strong> and type the right value, or <strong>? Unsure</strong> and say why. Blank is correct when the judgment doesn't mention it. If everything is right, just press <strong>All correct, save</strong>. You don't need legal judgement: when it would take some, choose Unsure.</p></details>
    </div>
    ${bad.length ? `<div class="card flags"><h3>Why this row was flagged</h3><ul>${bad.map(c => `<li>${esc(c.check.replaceAll("_", " "))}${c.detail ? ": " + esc(c.detail) : ""}</li>`).join("")}</ul></div>` : ""}
    ${hdrRows ? `<div class="card"><h3>Header details</h3><div class="q">Already matched against the top of the judgment by script. Just glance.</div>
      <table class="hdr">${hdrRows}</table>
      <label style="display:block;margin-top:8px"><input type="checkbox" id="hdrok" ${headerOk ? "checked" : ""}> These match the top of the judgment</label></div>` : ""}
    ${judge || '<div class="card">No extracted details for this row. Read the judgment and write what you find in the note below.</div>'}
    <details class="card"><summary><strong>Optional:</strong> note, or a correction to send Charlotin</summary>
      <p class="muted" style="margin:8px 0 4px">Note</p><textarea id="note">${esc(r.decision?.note || "")}</textarea>
      <p class="muted" style="margin:8px 0 4px">Correction for Charlotin's database</p><textarea id="corr">${esc(r.decision?.charlotin_correction || "")}</textarea>
    </details>
    <div class="btns"><button class="primary" id="allok">All correct, save</button> <button class="secondary" id="save">Save</button> <span id="saved" class="muted"></span></div>`;

  document.querySelectorAll("#detail .field").forEach(el => {
    const mark = v => {
      el.dataset.verdict = v;
      el.querySelectorAll(".btns button").forEach(b => b.className = b.dataset.v === v ? "sel-" + v : "");
      const ex = el.querySelector(".extra");
      ex.classList.toggle("hidden", v === "correct" || !v);
      ex.querySelector("input").placeholder = v === "unsure" ? "Why unsure?" : "The right value";
    };
    el.querySelectorAll(".btns button").forEach(b => b.onclick = () => mark(b.dataset.v));
    if (el.dataset.verdict) mark(el.dataset.verdict);
  });
  const hb = document.getElementById("hdrok");
  if (hb) hb.onchange = () => document.querySelectorAll(".hfix").forEach(td => td.classList.toggle("hidden", hb.checked));
  document.getElementById("save").onclick = () => save(r, false);
  document.getElementById("allok").onclick = () => save(r, true);
}

async function save(r, allOk){
  const fields = {}, hb = document.getElementById("hdrok");
  for (const k of HEADER.filter(k => k in r.fields)) {
    const fix = document.querySelector(`[data-hfield="${k}"]`)?.value.trim();
    fields[k] = (!hb || hb.checked || !fix) ? { verdict: "correct", value: null } : { verdict: "corrected", value: fix };
  }
  const unmarked = [];
  document.querySelectorAll("#detail .field").forEach(el => {
    let v = el.dataset.verdict;
    if (!v && allOk) v = "correct";
    if (!v) { unmarked.push(HELP[el.dataset.field][0]); return; }
    fields[el.dataset.field] = { verdict: v, value: v === "correct" ? null : (el.querySelector(".extra input").value.trim() || null) };
  });
  if (unmarked.length) { document.getElementById("saved").textContent = "Not saved. Still to mark: " + unmarked.join("; "); return; }
  const body = { fields, note: document.getElementById("note").value, charlotin_correction: document.getElementById("corr").value,
                 random_spot_check: r.random_spot_check };
  const res = await fetch(`/api/decision/${r.row}`, { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body) });
  if (!res.ok) { document.getElementById("saved").textContent = "Save failed."; return; }
  r.decision = body; renderList();
  const next = visible().find(x => !x.decision);
  if (next) show(next.row); else document.getElementById("saved").textContent = "Saved. All rows in this list are done.";
}

// ---- Questions -------------------------------------------------------------
const QUESTIONS = [
  { id: "review_scope", q: "How much of the tracker review will you do?", opts: [
    ["A", "A: the 10 random rows only (~2 h). Recommended minimum."], ["B", "B: the 10 random rows plus the 20 flagged rows (~5 h)."],
    ["C", "C: skip it, and publish as 'automatically checked, not reviewed by a person'."]] },
  { id: "corrections_email", q: "Corrections email address for the site (decision A1). Leave blank if not created yet.", text: true },
  { id: "rules_check", q: "How will you check the rules matrix (7 courts)?", opts: [
    ["read_cells", "Read each cell next to its quoted paragraph (~1 h). Recommended."], ["full", "Check every cell against the whole instrument (~7 h, the brief's plan)."]] },
  { id: "hand_collect", q: "The 9 court instruments the brief says you collect by hand (Federal Court, FCFCOA, FWC, ART, County Court, VCAT, QCAT, WA District Court, WA SAT)?", opts: [
    ["before_launch", "Before launch (~1.5 h)."], ["after_launch", "After launch: the matrix shows them as 'pending' for now."]] },
  { id: "d007_reason", q: "In one or two sentences, in your own words: why is sending the AustLII-printed judgments (headers stripped) to the AI acceptable after reading AustLII's terms? (Goes into DECISIONS.md D007.)", text: true, long: true },
  { id: "checklist", q: "The one-page checklist (site/checklist.pdf):", opts: [
    ["approve", "Approve as is."], ["edits", "I want changes (write them below)."]], textAfter: "Changes, if any" },
  { id: "methods_factpack", q: "Shall I draft these now?", opts: [
    ["both", "Both: the 2-page methods paper and a fact pack for your practice note."], ["methods", "Methods paper only."], ["factpack", "Fact pack only."], ["neither", "Neither for now."]] },
  { id: "nonlawyer_note", q: "On the About page, say the spot-check was done by you (not a lawyer) against the judgment text?", opts: [
    ["yes", "Yes, say so."], ["no", "No, keep it as is."]] },
  { id: "github_username", q: "Your GitHub username (129313531343-bit) will appear in the repo link on your CV:", opts: [
    ["keep", "Keep it."], ["change", "I'll change it (new name below)."]], textAfter: "New username, if changing" },
  { id: "austlii_link", q: "After your first row: did the 'Open the judgment' link open the right decision?", opts: [
    ["yes", "Yes."], ["no", "No (describe below)."], ["not_yet", "Haven't tried yet."]], textAfter: "What happened, if not" },
];
async function renderQuestions(){
  const a = await (await fetch("/api/answers")).json();
  document.getElementById("qform").innerHTML = `<h2 style="margin-top:0">Questions for you</h2>
    <p class="muted">Answer what you can, press Save at the bottom, and come back any time. Your answers are saved on your Mac only.</p>` +
    QUESTIONS.map((x, i) => `<div class="card"><h3>${i + 1}. ${esc(x.q)}</h3>
      ${(x.opts || []).map(([v, l]) => `<label><input type="radio" name="${x.id}" value="${v}" ${a[x.id] === v ? "checked" : ""}> ${esc(l)}</label>`).join("")}
      ${x.text ? (x.long ? `<textarea name="${x.id}">${esc(a[x.id] || "")}</textarea>` : `<input type="text" name="${x.id}" value="${esc(a[x.id] || "")}">`) : ""}
      ${x.textAfter ? `<input type="text" name="${x.id}_text" placeholder="${esc(x.textAfter)}" value="${esc(a[x.id + "_text"] || "")}" style="margin-top:6px">` : ""}
    </div>`).join("") +
    `<div class="btns"><button class="primary" id="qsave">Save answers</button> <span id="qsaved" class="muted">${a.answered_on ? "Last saved " + esc(a.answered_on) : ""}</span></div>`;
  document.getElementById("qsave").onclick = async () => {
    const out = {};
    for (const x of QUESTIONS) {
      const r = document.querySelector(`input[name="${x.id}"]:checked`); if (r) out[x.id] = r.value;
      const t = document.querySelector(`[name="${x.id}"]:not([type=radio])`); if (t && t.value.trim()) out[x.id] = t.value.trim();
      const ta = document.querySelector(`[name="${x.id}_text"]`); if (ta && ta.value.trim()) out[x.id + "_text"] = ta.value.trim();
    }
    const res = await fetch("/api/answers", { method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(out) });
    document.getElementById("qsaved").textContent = res.ok ? "Saved." : "Save failed.";
  };
}
const LABELS = {
  non_existent: "the court says the case or source does not exist",
  not_located: "the court could not find it",
  exists_but_misdescribed: "real, but it does not say what it was cited for",
  false_quote: "the quoted words are not in the source",
  wrong_pinpoint: "real, but the page or paragraph is wrong",
  not_stated: "the judgment does not say which kind",
};
async function renderFakes(){
  const list = await (await fetch("/api/impugned")).json();
  const done = list.filter(c => c.decision).length;
  list.sort((a, b) => !!a.decision - !!b.decision);
  document.getElementById("fakesview").innerHTML = `<h2 style="margin-top:0">Check the fake citations</h2>
    <p class="muted">${done} of ${list.length} cases saved (${list.reduce((n, c) => n + c.citations.length, 0)} citations).
    Unchecked cases are at the top. For each citation, the grey box shows the judgment's own words, already matched exactly to the judgment text.
    Ask two things: <strong>(1) is the citation copied exactly as the judgment gives it?</strong> and
    <strong>(2) does the label match what the court said?</strong> Open the judgment if the words are not enough.
    At the bottom of each case, note any fake citation the court lists that is missing here. About 1 hour.</p>` +
    list.map(c => `<div class="card fake" data-row="${esc(c.row)}">
      <h3>${esc(c.id)} · ${esc(c.mnc || "(no citation)")} · ${esc(c.court)} · ${esc(c.date)}</h3>
      <div class="muted">${esc(c.title)}</div>
      <p style="margin:6px 0 10px">${Object.entries(c.links).map(([k, u]) => `<a class="big" href="${esc(u)}" target="_blank" rel="noopener">Open the judgment (${esc(k)}) ↗</a>`).join(" ")}
        ${c.decision ? '<span class="tag done">saved</span>' : ''}</p>
      ${c.citations.map((x, i) => { const dv = c.decision?.citations?.[i] || {};
        return `<div class="card field" data-i="${i}" data-verdict="${esc(dv.verdict || "")}" style="margin-bottom:8px">
        <div class="value" style="font-family:ui-monospace,monospace">${esc(x.citation)}</div>
        <div>Label: <strong>${esc(x.label)}</strong> <span class="muted">(${esc(LABELS[x.label] || "")})</span>${x.asserted_by && x.asserted_by !== "court" ? ` · <span class="tag flag">said by ${esc(x.asserted_by)}, not the court</span>` : ""}</div>
        ${x.quotes.map(q => `<blockquote>${esc(q.text)}<span class="loc">page ${esc(q.page)}${q.paragraph ? ", paragraph " + esc(q.paragraph) : ""}</span></blockquote>`).join("")}
        <div class="btns"><button data-v="correct">✓ Right</button><button data-v="corrected">✗ Needs fixing</button><button data-v="unsure">? Unsure</button></div>
        <div class="extra hidden" style="margin-top:8px"><input type="text" value="${esc(dv.value ?? "")}"></div></div>`; }).join("")}
      <label class="muted" style="display:block;margin:6px 0 4px">Fake citations the court lists that are missing above (copy them exactly), or leave blank:</label>
      <textarea class="missing">${esc(c.decision?.missing || "")}</textarea>
      <div class="btns"><button class="primary fall">All right, save</button> <button class="secondary fsave">Save</button> <span class="muted fsaved"></span></div>
    </div>`).join("");
  document.querySelectorAll(".fake .field").forEach(el => {
    const mark = v => { el.dataset.verdict = v; el.querySelectorAll(".btns button").forEach(b => b.className = b.dataset.v === v ? "sel-" + v : "");
      const ex = el.querySelector(".extra"); ex.classList.toggle("hidden", v === "correct" || !v);
      ex.querySelector("input").placeholder = v === "unsure" ? "Why unsure?" : "The correct citation or label"; };
    el.querySelectorAll(".btns button").forEach(b => b.onclick = () => mark(b.dataset.v));
    if (el.dataset.verdict) mark(el.dataset.verdict);
  });
  document.querySelectorAll(".fake").forEach(card => {
    const save = async allOk => {
      const citations = [], missing = [];
      card.querySelectorAll(".field").forEach(el => { let v = el.dataset.verdict; if (!v && allOk) v = "correct";
        if (!v) { missing.push(Number(el.dataset.i) + 1); return; }
        citations[Number(el.dataset.i)] = { verdict: v, value: v === "correct" ? null : (el.querySelector(".extra input").value.trim() || null) }; });
      if (missing.length) { card.querySelector(".fsaved").textContent = "Not saved. Still to mark: citation " + missing.join(", "); return; }
      const res = await fetch("/api/impugned_decision", { method: "POST", headers: {"Content-Type": "application/json"},
        body: JSON.stringify({ row: card.dataset.row, citations, missing: card.querySelector(".missing").value.trim() }) });
      if (res.ok) renderFakes(); else card.querySelector(".fsaved").textContent = "Save failed.";
    };
    card.querySelector(".fall").onclick = () => save(true);
    card.querySelector(".fsave").onclick = () => save(false);
  });
}
load();
if (location.hash === "#rules") tab("rules");  // http://127.0.0.1:8765/#rules opens straight on the Rules tab
if (location.hash === "#fakes") tab("fakes");
</script>
